<svg width="680" height="480" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Pastel woven ribbons with repositioned mycelial threads</title>
<desc>Five wide, gently curved pastel ribbons in lavender, mint, peach, pink, and soft gold. Three mycelial threads cross the ribbons: a thin gold thread near the left edge, a medium dusty-rose thread centered in the middle, and a thicker soft-teal thread on the right kept in its previous position.</desc>
<defs>
<linearGradient id="n1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#CECBF6"/><stop offset="100%" stop-color="#AFA9EC"/></linearGradient>
